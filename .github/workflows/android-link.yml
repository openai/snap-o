name: Android Link

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'snapo-link-android/**'
      - '.github/workflows/android-link.yml'
      - 'VERSION'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'snapo-link-android/**'
      - '.github/workflows/android-link.yml'
      - 'VERSION'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: snapo-link-android
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: snapo-link-android
        run: chmod +x gradlew
      - name: Assemble Android libraries and samples
        working-directory: snapo-link-android
        run: ./gradlew --no-daemon --profile -Psnapo.samples.minifyRelease=false assemble
      - name: Upload assembly profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-assemble-profile
          path: snapo-link-android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: snapo-link-android
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: snapo-link-android
        run: chmod +x gradlew
      - name: Run Android lint and unit tests
        working-directory: snapo-link-android
        run: ./gradlew --no-daemon --profile -Psnapo.samples.minifyRelease=false check -x detekt
      - name: Upload verification profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-check-profile
          path: snapo-link-android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  detekt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: snapo-link-android
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: snapo-link-android
        run: chmod +x gradlew
      - name: Run Detekt
        working-directory: snapo-link-android
        run: ./gradlew --no-daemon detekt
