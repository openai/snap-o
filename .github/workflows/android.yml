name: Android

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'plugins/**'
      - 'sdk/**'
      - 'examples/android/**'
      - 'examples/plugin/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'release/validate_authoring.py'
      - 'plugin-reader/**'
      - 'contracts/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'plugins/**'
      - 'sdk/**'
      - 'examples/android/**'
      - 'examples/plugin/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'release/validate_authoring.py'
      - 'plugin-reader/**'
      - 'contracts/**'
      - '.github/workflows/android.yml'
      - 'VERSION'

# Only PR runs share a group; push runs finish to populate Gradle caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: .
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: .
        run: chmod +x gradlew
      - name: Assemble debug libraries and samples with implementations
        working-directory: .
        run: ./gradlew --no-daemon --profile assembleDebug
      - name: Assemble debug samples with no-ops
        working-directory: .
        run: ./gradlew --no-daemon --profile -Psnapo.samples.noop=true assembleDebug
      - name: Upload assembly profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-assemble-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify bundled Android discovery reader
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          python3 plugin-reader/build.py --check
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: .
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: .
        run: chmod +x gradlew
      - name: Lint and test debug libraries and samples with implementations
        working-directory: .
        run: ./gradlew --no-daemon --profile lintDebug testDebugUnitTest
      - name: Lint and test debug samples with no-ops
        working-directory: .
        run: ./gradlew --no-daemon --profile -Psnapo.samples.noop=true lintDebug testDebugUnitTest
      - name: Upload verification profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-check-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  detekt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Prepare local.properties
        working-directory: .
        run: |
          cat <<EOL > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOL
      - name: Grant execute permission for Gradle wrapper
        working-directory: .
        run: chmod +x gradlew
      - name: Run Detekt
        working-directory: .
        run: ./gradlew --no-daemon detekt

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [network, tweaks]
    defaults:
      run:
        working-directory: plugins/${{ matrix.module }}/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node for tool frontends
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/${{ matrix.module }}/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
      - name: Validate local authoring packages and independent Example tool
        run: python3 release/validate_authoring.py --output "${RUNNER_TEMP}/snapo-authoring"
      - name: Upload validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authoring-validation
          path: ${{ runner.temp }}/snapo-authoring/report.json
