name: Mac

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app-macos/**'
      - 'tool-sdk/host/**'
      - 'tools/tweaks/frontend/**'
      - 'tools/network/frontend/**'
      - 'tools/frontend/**'
      - 'contracts/**'
      - 'skills/snap-o-network-inspector/scripts/**'
      - 'skills/snap-o-tweaks/scripts/**'
      - 'tool-reader/**'
      - '.github/workflows/mac.yml'
      - 'VERSION'
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Mac web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool-sdk/host/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix tool-sdk/host
          npm ci --prefix tools/network/frontend
          npm ci --prefix tools/tweaks/frontend
      - name: Check formatting
        working-directory: tool-sdk/host
        run: npm run format:check
      - name: Lint
        working-directory: tool-sdk/host
        run: npm run lint
      - name: Typecheck
        working-directory: tool-sdk/host
        run: npm run typecheck
      - name: Test
        working-directory: tool-sdk/host
        run: npm test

  test:
    name: Mac tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1.1'
      - name: Build and test macOS app
        working-directory: app-macos
        run: |
          xcodebuild -project Snap-O.xcodeproj -scheme Snap-O \
            -destination "platform=macOS" -derivedDataPath "$RUNNER_TEMP/snap-o-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Test capture integration
        working-directory: app-macos
        run: sh scripts/test-startup-capture.sh
      - name: Test recording failures
        working-directory: app-macos
        run: sh scripts/test-recording.sh
      - name: Test emulator preview
        working-directory: app-macos
        run: sh scripts/test-emulator-preview.sh
      - name: Test tool recovery
        working-directory: app-macos
        env:
          SNAPO_DERIVED_DATA: ${{ runner.temp }}/snap-o-derived-data
        run: sh scripts/test-tool-recovery.sh

      - name: Device Manager tests
        run: bash app-macos/Tests/DeviceManager/test.sh

  style:
    name: Mac style
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
      - name: Set up mise
        working-directory: app-macos
        run: ./scripts/ci-install-mise.sh
      - name: Install tools
        working-directory: app-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust --quiet
          mise install
      - name: SwiftFormat
        working-directory: app-macos
        run: mise exec -- swiftformat . --lint --config .swiftformat --reporter github-actions-log
      - name: SwiftLint
        working-directory: app-macos
        run: mise exec -- swiftlint lint --strict --no-cache --reporter github-actions-logging
