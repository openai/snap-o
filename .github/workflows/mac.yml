name: Mac

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'snapo-app-mac/**'
      - 'inspectors/**'
      - 'snapo-link-android/tweaks-core/frontend/**'
      - 'snapo-link-android/network/frontend/**'
      - 'contracts/**'
      - 'scripts/snapo'
      - 'scripts/snapo-discovery.jar'
      - 'android-discovery/**'
      - '.github/workflows/mac.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'snapo-app-mac/**'
      - 'inspectors/**'
      - 'snapo-link-android/tweaks-core/frontend/**'
      - 'snapo-link-android/network/frontend/**'
      - 'contracts/**'
      - 'scripts/snapo'
      - 'scripts/snapo-discovery.jar'
      - 'android-discovery/**'
      - '.github/workflows/mac.yml'
      - 'VERSION'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inspectors/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix inspectors
          npm ci --prefix snapo-link-android/network/frontend
          npm ci --prefix snapo-link-android/tweaks-core/frontend
      - name: Check formatting
        working-directory: inspectors
        run: npm run format:check
      - name: Lint
        working-directory: inspectors
        run: npm run lint
      - name: Typecheck
        working-directory: inspectors
        run: npm run typecheck
      - name: Test
        working-directory: inspectors
        run: npm test

  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1.1'
      - name: Test shared device client
        working-directory: snapo-app-mac/SnapODeviceClient
        run: swift test
      - name: Test live preview frame export
        working-directory: snapo-app-mac
        run: sh scripts/test-live-preview-frame-export.sh
      - name: Test live preview pointer delivery
        working-directory: snapo-app-mac
        run: sh scripts/test-live-preview-pointer.sh
      - name: Test capture mode transitions
        working-directory: snapo-app-mac
        run: sh scripts/test-capture-modes.sh
      - name: Test capture startup
        working-directory: snapo-app-mac
        run: sh scripts/test-startup-capture.sh
      - name: Set up Node for inspector lifecycle tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            snapo-link-android/network/frontend/package-lock.json
            snapo-link-android/tweaks-core/frontend/package-lock.json
      - name: Build Network test resources
        working-directory: snapo-link-android/network/frontend
        run: |
          npm ci
          npm run build
      - name: Build Tweaks test resources
        working-directory: snapo-link-android/tweaks-core/frontend
        run: |
          npm ci
          npm run build
      - name: Test inspector recovery
        working-directory: snapo-app-mac
        run: sh scripts/test-inspector-recovery.sh
      - name: Test inspector selection
        working-directory: snapo-app-mac
        run: sh scripts/test-inspector-selection.sh

  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1.1'
      - name: Build Snap-O
        working-directory: snapo-app-mac
        run: |
          set -o pipefail
          xcodebuild -project Snap-O.xcodeproj \
                     -scheme Snap-O \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build

  style:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
      - name: Set up mise
        working-directory: snapo-app-mac
        run: ./scripts/ci-install-mise.sh
      - name: Install tools
        working-directory: snapo-app-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust --quiet
          mise install
      - name: SwiftFormat
        working-directory: snapo-app-mac
        run: mise exec -- swiftformat . --lint --config .swiftformat --reporter github-actions-log
      - name: SwiftLint
        working-directory: snapo-app-mac
        run: mise exec -- swiftlint lint --strict --no-cache --reporter github-actions-logging
