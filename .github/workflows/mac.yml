name: Mac

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app-macos/**'
      - 'tool-sdk/host/**'
      - 'tools/tweaks/frontend/**'
      - 'tools/network/frontend/**'
      - 'tools/frontend/**'
      - 'contracts/**'
      - 'skills/snap-o-network-inspector/scripts/**'
      - 'skills/snap-o-tweaks/scripts/**'
      - 'tool-reader/**'
      - '.github/workflows/mac.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'app-macos/**'
      - 'tool-sdk/host/**'
      - 'tools/tweaks/frontend/**'
      - 'tools/network/frontend/**'
      - 'tools/frontend/**'
      - 'contracts/**'
      - 'skills/snap-o-network-inspector/scripts/**'
      - 'skills/snap-o-tweaks/scripts/**'
      - 'tool-reader/**'
      - '.github/workflows/mac.yml'
      - 'VERSION'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool-sdk/host/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix tool-sdk/host
          npm ci --prefix tools/network/frontend
          npm ci --prefix tools/tweaks/frontend
      - name: Check formatting
        working-directory: tool-sdk/host
        run: npm run format:check
      - name: Lint
        working-directory: tool-sdk/host
        run: npm run lint
      - name: Typecheck
        working-directory: tool-sdk/host
        run: npm run typecheck
      - name: Test
        working-directory: tool-sdk/host
        run: npm test

  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1.1'
      - name: Test macOS device services
        working-directory: app-macos
        run: xcodebuild -project Snap-O.xcodeproj -scheme Snap-O -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Test live preview frame export
        working-directory: app-macos
        run: sh scripts/test-live-preview-frame-export.sh
      - name: Test live preview pointer delivery
        working-directory: app-macos
        run: sh scripts/test-live-preview-pointer.sh
      - name: Test capture mode transitions
        working-directory: app-macos
        run: sh scripts/test-capture-modes.sh
      - name: Test capture startup
        working-directory: app-macos
        run: sh scripts/test-startup-capture.sh
      - name: Set up Node for tool lifecycle tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tools/network/frontend/package-lock.json
            tools/tweaks/frontend/package-lock.json
      - name: Build Network test resources
        working-directory: tools/network/frontend
        run: |
          npm ci
          npm run build
      - name: Build Tweaks test resources
        working-directory: tools/tweaks/frontend
        run: |
          npm ci
          npm run build
      - name: Test tool recovery
        working-directory: app-macos
        run: sh scripts/test-tool-recovery.sh
      - name: Test tool selection
        working-directory: app-macos
        run: sh scripts/test-tool-selection.sh

  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1.1'
      - name: Build Snap-O
        working-directory: app-macos
        run: |
          set -o pipefail
          xcodebuild -project Snap-O.xcodeproj \
                     -scheme Snap-O \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build

  style:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
      - name: Set up mise
        working-directory: app-macos
        run: ./scripts/ci-install-mise.sh
      - name: Install tools
        working-directory: app-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust --quiet
          mise install
      - name: SwiftFormat
        working-directory: app-macos
        run: mise exec -- swiftformat . --lint --config .swiftformat --reporter github-actions-log
      - name: SwiftLint
        working-directory: app-macos
        run: mise exec -- swiftlint lint --strict --no-cache --reporter github-actions-logging
